{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-enhanced">

        <div class="auth-header">
            <h2>Change Password</h2>
            <p>Update your password to keep your account secure.</p>
        </div>

        {% if error %}
        <div class="auth-alert auth-alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            <div class="auth-form-group">
                <label for="current_password">Current Password</label>
                <div class="auth-password-wrapper">
                    <input type="password" id="current_password" name="current_password"
                        placeholder="Enter your current password" required autofocus>
                    <button type="button" class="auth-password-toggle"
                        onclick="togglePassword('current_password', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="auth-form-group">
                <label for="new_password">New Password</label>
                <div class="auth-password-wrapper">
                    <input type="password" id="new_password" name="new_password" placeholder="Enter your new password"
                        required>
                    <button type="button" class="auth-password-toggle" onclick="togglePassword('new_password', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="auth-form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="auth-password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Re-enter your new password" required>
                    <button type="button" class="auth-password-toggle"
                        onclick="togglePassword('confirm_password', this)">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-button">Update Password</button>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }
</script>
{% endblock %}
