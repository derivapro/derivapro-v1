{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-enhanced">

        <div class="auth-header">
            <h2>Forgot Password</h2>
            <p>Enter your username to continue with identity verification and password reset.</p>
        </div>

        {% if error %}
        <div class="auth-alert auth-alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            <div class="auth-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <button type="submit" class="auth-button">Continue</button>
        </form>

        <div class="auth-footer">
            <p>Remembered your password?</p>
            <a href="{{ url_for('auth.login') }}" class="auth-secondary-link">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
