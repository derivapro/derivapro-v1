{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-enhanced">

        <div class="auth-header">
            <h2>Reset Password</h2>
            <p>Create a new password using your expiring reset link.</p>
        </div>

        {% if error %}
        <div class="auth-alert auth-alert-error">
            {{ error }}
        </div>
        {% endif %}

        <div class="auth-security-box">
            <p><strong>Username:</strong> {{ username }}</p>
        </div>

        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-form-group">
                <label for="password">New Password</label>
                <div class="auth-password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter a new password" required>
                    <button type="button" class="auth-password-toggle" onclick="togglePassword('password', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="auth-form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="auth-password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Re-enter your new password" required>
                    <button type="button" class="auth-password-toggle"
                        onclick="togglePassword('confirm_password', this)">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-button">Reset Password</button>
        </form>

        <div class="auth-footer">
            <p>Want to return to sign in?</p>
            <a href="{{ url_for('auth.login') }}" class="auth-secondary-link">Back to login</a>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }
</script>
{% endblock %}
